<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Admin</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
padding:30px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
}

h1{
text-align:center;
color:#003366;
}

input, select, button{
width:100%;
padding:12px;
margin:8px 0;
}

button{
background:#003366;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#005599;
}

#result{
margin-top:20px;
text-align:center;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>ADC Logistics Admin</h1>

<input id="sender" placeholder="Sender Name">

<input id="receiver" placeholder="Receiver Name">

<input id="departure" placeholder="Departure">

<input id="arrival" placeholder="Arrival">

<input id="location" placeholder="Current Location">

<select id="status">
<option value="Shipment Created">Shipment Created</option>
<option value="In Transit">In Transit</option>
<option value="Arrived">Arrived</option>
<option value="Delivered">Delivered</option>
</select>

<button onclick="createShipment()">
Create Shipment
</button>


<div id="result"></div>

</div>


<script>

const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";


async function createShipment(){

let trackingNumber =
"ADC" + Math.floor(Math.random()*900000+100000);


let shipment = {

tracking: trackingNumber,

sender: document.getElementById("sender").value,

receiver: document.getElementById("receiver").value,

departure: document.getElementById("departure").value,

arrival: document.getElementById("arrival").value,

location: document.getElementById("location").value,

status: document.getElementById("status").value,

history:
"Shipment created on " + new Date().toLocaleString()

};


await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify(shipment)
});


document.getElementById("result").innerHTML =
"Shipment Created Successfully<br><br>Tracking Number:<h2>"
+ trackingNumber +
"</h2>";

}

</script>

</body>
</html>
