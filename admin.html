<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Admin</title>
<style>
body{
font-family:Arial;
padding:30px;
text-align:center;
background:#f2f2f2;
}

.box{
background:white;
padding:25px;
max-width:500px;
margin:auto;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:5px;
}

button{
padding:12px 20px;
background:#0066cc;
color:white;
border:0;
}

textarea{
width:90%;
height:150px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

<h1>ADC Logistics Admin</h1>

<input id="tracking" placeholder="Tracking Number">
<input id="customer" placeholder="Customer Name">
<input id="origin" placeholder="Origin">
<input id="destination" placeholder="Destination">
<input id="status" placeholder="Status">
<input id="location" placeholder="Location">
<input id="arrival" placeholder="Arrival Date">

<button onclick="create()">Generate Shipment</button>

<textarea id="output"></textarea>

</div>


<script>

function create(){

let shipment = {
tracking:tracking.value,
customer:customer.value,
origin:origin.value,
destination:destination.value,
status:status.value,
location:location.value,
arrival:arrival.value,
history:[
"Shipment Created"
]
};


output.value =
JSON.stringify(shipment,null,2);

}

</script>

</body>
</html>
