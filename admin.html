<!DOCTYPE html>
<html>
<head>

<title>ADC Logistics Admin</title>

<style>

body{
font-family:Arial;
background:#eef3f8;
padding:30px;
}

.box{
background:white;
max-width:500px;
margin:auto;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px #ccc;
}

input, select, button{
width:90%;
padding:12px;
margin:10px;
}

button{
background:#003366;
color:white;
border:none;
cursor:pointer;
}

#result{
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics Admin</h1>

<input id="sender" placeholder="Sender Name">

<input id="receiver" placeholder="Receiver Name">

<label>Departure Date</label>
<input type="date" id="departure">

<label>Arrival Date</label>
<input type="date" id="arrival">

<input id="location" placeholder="Current Location">


<select id="status">
<option>Received</option>
<option>Processing</option>
<option>In Transit</option>
<option>Customs Clearance</option>
<option>Out for Delivery</option>
<option>Delivered</option>
</select>


<button onclick="createShipment()">
Create Shipment
</button>


<div id="result"></div>


</div>


<script>


function createShipment(){


let trackingNumber =
"ADC" + Math.floor(100000 + Math.random()*900000);



let shipment = {

tracking: trackingNumber,

sender: document.getElementById("sender").value,

receiver: document.getElementById("receiver").value,

departure: document.getElementById("departure").value,

arrival: document.getElementById("arrival").value,

location: document.getElementById("location").value,

status: document.getElementById("status").value

};



localStorage.setItem(
trackingNumber,
JSON.stringify(shipment)
);



document.getElementById("result").innerHTML =

"Shipment Created Successfully<br><br>" +

"Tracking Number:<br>" +

"<h2>" + trackingNumber + "</h2>" +

"Save this number for the customer";


}


</script>


</body>
</html>
