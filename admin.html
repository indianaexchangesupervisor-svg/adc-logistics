<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Admin</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef3f8;
    padding: 30px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 15px #ccc;
}

input, select, button {
    width: 90%;
    padding: 12px;
    margin: 10px;
}

button {
    background: #003366;
    color: white;
    border: none;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics Admin</h1>

<h3>Create Shipment</h3>

<input id="tracking" placeholder="Tracking Number">

<input id="customer" placeholder="Customer Name">

<input id="location" placeholder="Current Location">

<select id="status">
<option>Received</option>
<option>Processing</option>
<option>In Transit</option>
<option>Customs Clearance</option>
<option>Out for Delivery</option>
<option>Delivered</option>
</select>

<button onclick="saveShipment()">Save Shipment</button>

<div id="result"></div>

</div>


<script>

async function saveShipment(){

let tracking = document.getElementById("tracking").value;
let customer = document.getElementById("customer").value;
let location = document.getElementById("location").value;
let status = document.getElementById("status").value;

localStorage.setItem(tracking, JSON.stringify({
customer: customer,
location: location,
status: status
}));

document.getElementById("result").innerHTML =
"Shipment saved: " + tracking;

}
