<!DOCTYPE html>
<html>

<head>
<title>ADC Logistics Admin</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:40px;
text-align:center;
}

.box{
background:white;
padding:30px;
max-width:500px;
margin:auto;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:8px;
}

button{
padding:12px 25px;
background:#0066cc;
color:white;
border:0;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics Admin</h1>

<input id="tracking" placeholder="Tracking Number">

<input id="customer" placeholder="Customer Name">

<input id="origin" placeholder="Origin">

<input id="destination" placeholder="Destination">

<input id="status" placeholder="Status">

<input id="location" placeholder="Current Location">

<input id="arrival" placeholder="Arrival Date">


<button onclick="createShipment()">
Create Shipment
</button>


<p id="message"></p>


</div>


<script>

function createShipment(){

let shipment={

tracking:
document.getElementById("tracking").value,

customer:
document.getElementById("customer").value,

origin:
document.getElementById("origin").value,

destination:
document.getElementById("destination").value,

status:
document.getElementById("status").value,

location:
document.getElementById("location").value,

arrival:
document.getElementById("arrival").value

};


localStorage.setItem(
shipment.tracking,
JSON.stringify(shipment)
);


document.getElementById("message").innerHTML =
"Shipment Created Successfully";

}

</script>

</div>

</body>

</html>
