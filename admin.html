<!DOCTYPE html>
<html>
<head>

<title>ADC Logistics Admin</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#eef3f8;
    padding:30px;
}

.box {
    background:white;
    max-width:500px;
    margin:auto;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px #ccc;
}

input, select, button {
    width:90%;
    padding:12px;
    margin:10px;
}

button {
    background:#003366;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover {
    background:#0055aa;
}

#result {
    margin-top:20px;
    font-weight:bold;
}

</style>

</head>


<body>

<div class="box">

<h1>ADC Logistics Admin</h1>

<h3>Create Shipment</h3>


<input id="tracking" placeholder="Tracking Number">


<input id="sender" placeholder="Sender Name">


<input id="receiver" placeholder="Receiver Name">


<label>Date of Departure</label>
<input type="date" id="departureDate">


<label>Date of Arrival</label>
<input type="date" id="arrivalDate">


<input id="location" placeholder="Current Location">


<select id="status">

<option>Received</option>
<option>Processing</option>
<option>In Transit</option>
<option>Customs Clearance</option>
<option>Out for Delivery</option>
<option>Delivered</option>

</select>


<button onclick="saveShipment()">
Save Shipment
</button>


<div id="result"></div>


</div>


<script>

function saveShipment(){


let shipment = {

tracking: document.getElementById("tracking").value,

sender: document.getElementById("sender").value,

receiver: document.getElementById("receiver").value,

departureDate: document.getElementById("departureDate").value,

arrivalDate: document.getElementById("arrivalDate").value,

location: document.getElementById("location").value,

status: document.getElementById("status").value

};


localStorage.setItem(
shipment.tracking,
JSON.stringify(shipment)
);



document.getElementById("result").innerHTML =

"Shipment Saved Successfully<br><br>" +

"Tracking Number: " + shipment.tracking + "<br>" +

"Sender: " + shipment.sender + "<br>" +

"Receiver: " + shipment.receiver + "<br>" +

"Status: " + shipment.status;


}


</script>


</body>
</html>
