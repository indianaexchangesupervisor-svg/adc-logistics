<!DOCTYPE html>
<html>
<head>

<title>ADC Logistics Admin</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:30px;
}

.box{
background:white;
padding:25px;
max-width:500px;
margin:auto;
border-radius:10px;
}

input, textarea{
width:90%;
padding:10px;
margin:6px;
}

button{
padding:12px 25px;
background:#0066cc;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics Admin</h1>

<input id="tracking" placeholder="Tracking Number">

<input id="customer" placeholder="Customer Name">

<input id="origin" placeholder="Origin">

<input id="destination" placeholder="Destination">

<input id="status" placeholder="Status">

<input id="location" placeholder="Current Location">

<input id="arrival" placeholder="Arrival Date">

<button onclick="generate()">Create Shipment</button>

<textarea id="output" placeholder="Shipment code will appear here"></textarea>

</div>


<script>

function generate(){

let shipment = {

tracking: document.getElementById("tracking").value,

customer: document.getElementById("customer").value,

origin: document.getElementById("origin").value,

destination: document.getElementById("destination").value,

status: document.getElementById("status").value,

location: document.getElementById("location").value,

arrival: document.getElementById("arrival").value,

history:[
"Shipment Created"
]

};


document.getElementById("output").value =
JSON.stringify(shipment,null,2);

}

</script>

</body>
</html>
