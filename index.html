<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Tracking</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.container{
background:white;
max-width:500px;
margin:auto;
padding:30px;
border-radius:10px;
}

input{
width:90%;
padding:12px;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
background:#0066cc;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

#result{
margin-top:20px;
text-align:left;
}
</style>

</head>

<body>

<div class="container">

<div style="background:#003366;color:white;padding:20px;border-radius:10px;margin-bottom:20px;">
<h1>🚚 ADC Logistics</h1>
<p>Fast • Secure • Worldwide Delivery</p>
</div>

<h3>Track Your Shipment</h3>

<input id="tracking" placeholder="Enter Tracking Number">

<br>

<button onclick="trackShipment()">
Track Shipment
</button>

<div id="result"></div>

</div>


<script>

async function trackShipment(){

let number = document.getElementById("tracking").value.trim();


let response = await fetch("shipments.json");

let shipments = await response.json();


let shipment = shipments.find(
item => item.tracking === number
);


if(shipment){

document.getElementById("result").innerHTML = `

<h3>Shipment Details</h3>

<p><b>Customer:</b> ${shipment.customer}</p>

<p><b>From:</b> ${shipment.origin}</p>

<p><b>To:</b> ${shipment.destination}</p>

<p><b>Status:</b> ${shipment.status}</p>

<p><b>Current Location:</b> ${shipment.location}</p>

<p><b>Expected Arrival:</b> ${shipment.arrival}</p>

<h4>Shipment History</h4>

${shipment.history.map(
h => `<p>✓ ${h}</p>`
).join("")}

`;

}

else{

document.getElementById("result").innerHTML =
"<p>Tracking number not found.</p>";

}

}

</script>

</body>
</html>
