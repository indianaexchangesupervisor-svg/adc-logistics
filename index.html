<!DOCTYPE html>
<html>
<head>

<title>ADC Logistics Tracking</title>

<style>
body {
    font-family: Arial;
    background:#eef3f8;
    margin:0;
}

.header {
    background:#003366;
    color:white;
    text-align:center;
    padding:25px;
}

.container {
    background:white;
    max-width:500px;
    margin:40px auto;
    padding:30px;
    text-align:center;
    border-radius:10px;
}

input {
    width:90%;
    padding:12px;
    margin:15px;
}

button {
    background:#ff9900;
    color:white;
    padding:12px 25px;
    border:none;
}

#result {
    margin-top:25px;
}
</style>

</head>


<body>

<div class="header">
<h1>ADC Logistics</h1>
<p>Airline Delivering Express</p>
</div>


<div class="container">

<h2>Track Your Package</h2>

<input id="trackingNumber" placeholder="Enter Tracking Number">


<br>

<button onclick="trackPackage()">
Track Package
</button>


<div id="result"></div>

</div>



<script>

function trackPackage(){

let number = document.getElementById("trackingNumber").value;

let shipment = localStorage.getItem(number);

let result = document.getElementById("result");


if(shipment){

let data = JSON.parse(shipment);


result.innerHTML =

"<h3>Shipment Found</h3>" +

"<b>Tracking Number:</b> " + data.tracking + "<br><br>" +

"<b>Sender:</b> " + data.sender + "<br><br>" +

"<b>Receiver:</b> " + data.receiver + "<br><br>" +

"<b>Departure Date:</b> " + data.departure + "<br><br>" +

"<b>Arrival Date:</b> " + data.arrival + "<br><br>" +

"<b>Location:</b> " + data.location + "<br><br>" +

"<b>Status:</b> " + data.status +
"<br><br><h3>Shipment History</h3>" +

data.history.map(item =>

item.date + " " + item.time + "<br>" +
item.message + "<br><br>"

).join("");

}

else if(number === ""){

result.innerHTML = "Please enter a tracking number.";

}

else{

result.innerHTML = "Tracking number not found.";

}

    }

</script>


</body>
</html>
