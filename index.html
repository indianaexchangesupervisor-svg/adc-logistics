<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Tracking</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.box{
background:white;
padding:30px;
border-radius:10px;
max-width:500px;
margin:auto;
}

input{
padding:12px;
width:80%;
}

button{
padding:12px 25px;
margin-top:15px;
background:#0066cc;
color:white;
border:none;
cursor:pointer;
}

#result{
margin-top:20px;
text-align:left;
}
</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics</h1>
<h3>Track Your Shipment</h3>

<input id="tracking" placeholder="Enter Tracking Number">

<br>

<button onclick="trackShipment()">Track Shipment</button>

<div id="result"></div>

</div>


<script>

function trackShipment(){

var number = document.getElementById("tracking").value;

var shipments = {

"ADC10001":{
status:"In Transit",
location:"Lagos Transit Center",
arrival:"30 July 2026",
history:[
"Shipment Created",
"Package Collected",
"Arrived at Transit Center"
]
}

};


if(shipments[number]){

var s = shipments[number];

document.getElementById("result").innerHTML =

"<h3>Shipment Details</h3>"+
"<p><b>Status:</b> "+s.status+"</p>"+
"<p><b>Location:</b> "+s.location+"</p>"+
"<p><b>Expected Arrival:</b> "+s.arrival+"</p>"+
"<h4>History</h4>"+
s.history.map(x=>"<p>✓ "+x+"</p>").join("");

}

else{

document.getElementById("result").innerHTML =
"Tracking number not found";

}

}

</script>


</body>
</html>
