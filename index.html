<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADC Logistics - Track Shipment</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #1e3a8a; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 20px; padding: 15px; border-radius: 8px; background: #f0f9ff; display: none; }
    .error { color: red; margin-top: 10px; }
    .label { font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🚚 ADC Logistics</h2>
      <p>Fast • Secure • Worldwide Delivery</p>
    </div>

    <h3>Track Your Shipment</h3>
    <input type="text" id="trackingInput" placeholder="Enter Tracking Number" value="ADC-UKIN-260814-2742">
    <button onclick="trackShipment()">Track Shipment</button>
    <div id="errorMsg" class="error"></div>

    <div id="result" class="result">
      <h4>Shipment Details</h4>
      <p><span class="label">Tracking:</span> <span id="rTracking"></span></p>
      <p><span class="label">Customer:</span> <span id="rCustomer"></span></p>
      <p><span class="label">From:</span> <span id="rSender"></span>, <span id="rOrigin"></span></p>
      <p><span class="label">To:</span> <span id="rDestination"></span></p>
      <p><span class="label">Status:</span> <span id="rStatus"></span></p>
      <p><span class="label">Location:</span> <span id="rLocation"></span></p>
      <p><span class="label">Expected Arrival:</span> <span id="rArrival"></span> at <span id="rArrivalTime"></span></p>
      <p><span class="label">Insured Value:</span> <span id="rValue"></span></p>
      <p><span class="label">Items:</span></p>
      <ul id="rItems"></ul>
      <p><span class="label">History:</span></p>
      <ul id="rHistory"></ul>
    </div>
  </div>

  <script>
    // 1. FIX: Make sure shipments is ALWAYS an array
    const shipments = [
      {
        "shipmentId": "SHIPMENT 1",
        "tracking": "ADC-UKIN-260814-2742",
        "sender": "Dr JAMES",
        "origin": "UK",
        "customer": "ABHIRAMI S",
        "phone": "+91 62826 16631",
        "destination": "BHAVA KANNAMPARA MOONU MUKKU P.O KERALA, TRIVANDRUM 695609",
        "status": "Packages in New Delhi international airport now. You will be charged customs fees before your package will be delivered to your home address in KERALA",
        "location": "India",
        "arrival": "14/08/2026",
        "arrivalTime": "9:30am",
        "insuredValue": "$70,000",
        "items": [
          "iPhone XS Max",
          "Wrist Watch",
          "Gold Ring",
          "Gold Necklace",
          "Handbag",
          "Gold Chain",
          "Women's Shoes",
          "Soap and Perfume",
          "Jewellery",
          "Envelope with $70,000"
        ],
        "history": [
          "Shipment created in UK.",
          "Shipment dispatched from UK.",
          "Shipment departed the United Kingdom.",
          "Shipment arrived at New Delhi International Airport.",
          "Awaiting customs charges before delivery to KERALA home address."
        ]
      }
    ];

    function trackShipment() {
      const input = document.getElementById('trackingInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const resultDiv = document.getElementById('result');
      
      errorMsg.innerText = "";
      resultDiv.style.display = "none";

      // 2. FIX: Check if shipments is an array before using .find
      if (!Array.isArray(shipments)) {
        errorMsg.innerText = "Error: shipments data not loaded";
        return;
      }

      // 3. FIX: Use .find safely
      const shipment = shipments.find(s => s.tracking === input);

      if (shipment) {
        document.getElementById('rTracking').innerText = shipment.tracking;
        document.getElementById('rCustomer').innerText = shipment.customer;
        document.getElementById('rSender').innerText = shipment.sender;
        document.getElementById('rOrigin').innerText = shipment.origin;
        document.getElementById('rDestination').innerText = shipment.destination;
        document.getElementById('rStatus').innerText = shipment.status;
        document.getElementById('rLocation').innerText = shipment.location;
        document.getElementById('rArrival').innerText = shipment.arrival;
        document.getElementById('rArrivalTime').innerText = shipment.arrivalTime;
        document.getElementById('rValue').innerText = shipment.insuredValue;
        
        document.getElementById('rItems').innerHTML = shipment.items.map(i => `<li>${i}</li>`).join('');
        document.getElementById('rHistory').innerHTML = shipment.history.map(h => `<li>${h}</li>`).join('');
        
        resultDiv.style.display = "block";
      } else {
        errorMsg.innerText = "Tracking number not found";
      }
    }

    // Auto track on page load
    window.onload = trackShipment;
  </script>
</body>
</html>
