<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Tracking</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.box{
background:white;
padding:30px;
border-radius:10px;
max-width:500px;
margin:auto;
box-shadow:0 0 10px #ccc;
}

input{
width:80%;
padding:12px;
font-size:16px;
}

button{
padding:12px 25px;
background:#0066cc;
color:white;
border:0;
cursor:pointer;
margin-top:15px;
}

#result{
margin-top:20px;
text-align:left;
}
</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics</h1>
<h3>Track Your Shipment</h3>

<input id="tracking" placeholder="Enter Tracking Number">

<br>

<button onclick="track()">Track Shipment</button>

<div id="result"></div>

</div>


<script>

async function track(){

let number=document.getElementById("tracking").value;

let response = await fetch(
"YOUR_GOOGLE_SCRIPT_URL?tracking="+number
);

let data=await response.json();


if(data.status){

document.getElementById("result").innerHTML=

`
<h3>Shipment Details</h3>

<p><b>Status:</b> ${data.status}</p>

<p><b>Location:</b> ${data.location}</p>

<p><b>Arrival:</b> ${data.arrival}</p>

<h4>History</h4>

${data.history.map(
h=>`<p>${h.date} ${h.time}<br>${h.message}</p>`
).join("")}

`;

}

else{

document.getElementById("result").innerHTML=
"Tracking number not found";

}

}

</script>


</body>
</html>
