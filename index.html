<script>

async function trackShipment(){

let number = document.getElementById("tracking").value;

let response = await fetch("shipments.json");

let shipments = await response.json();


let shipment = shipments.find(
s => s.tracking === number
);


if(shipment){

document.getElementById("result").innerHTML = `

<h3>Shipment Details</h3>

<p><b>Customer:</b> ${shipment.customer}</p>

<p><b>Status:</b> ${shipment.status}</p>

<p><b>Location:</b> ${shipment.location}</p>

<p><b>Arrival:</b> ${shipment.arrival}</p>

<h4>History</h4>

${shipment.history.map(
x => `<p>✓ ${x}</p>`
).join("")}

`;

}

else{

document.getElementById("result").innerHTML =
"Tracking number not found";

}

}

</script>
