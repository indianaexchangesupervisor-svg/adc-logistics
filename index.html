<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Tracking</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.container{
background:white;
max-width:500px;
margin:auto;
padding:30px;
border-radius:10px;
}

input{
width:90%;
padding:12px;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
background:#0066cc;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

#result{
margin-top:20px;
text-align:left;
}
</style>

</head>

<body>

<div class="container">

<div style="background:#003366;color:white;padding:20px;border-radius:10px;margin-bottom:20px;">
<h1>🚚 ADC Logistics</h1>
<p>Fast • Secure • Worldwide Delivery</p>
</div>

<h3>Track Your Shipment</h3>

<input id="tracking" placeholder="Enter Tracking Number">

<br>

<button onclick="trackShipment()">
Track Shipment
</button>

<div id="result"></div>

</div>


<script>

async function trackShipment(){

let number = document.getElementById("tracking").value.trim();


let response = await fetch("shipments.json");

let shipments = await response.json();


try {
    let shipment = shipments.find(item => item.tracking === number);

    if (!shipment) {
        document.getElementById("result").innerHTML =
            "<p>Tracking number not found.</p>";
        return;
    }

    // Your existing code here...

} catch (e) {
    document.getElementById("result").innerHTML =
        "<p style='color:red'>Error: " + e.message + "</p>";
}


if(shipment){

document.getElementById("result").innerHTML = `

<h2 style="color:#003366;">Shipment Details</h2>

<div style="border:1px solid #ddd;border-radius:10px;padding:15px;background:#fafafa;">

<p><b>Tracking Number:</b> ${shipment.tracking}</p>

<p><b>Status:</b> <span style="background:green;color:white;padding:5px 10px;border-radius:5px;">${shipment.status}</span></p>

<p><b>Customer:</b> ${shipment.customer}</p>

<p><b>From:</b> ${shipment.origin}</p>

<p><b>To:</b> ${shipment.destination}</p>

<p><b>Current Location:</b> ${shipment.location}</p>

<p><b>Expected Arrival:</b> ${shipment.arrival}</p>
<h3>📦 Package Contents</h3>

<ul>
${shipment.items.map(item => `<li>${item}</li>`).join("")}
</ul>

<hr>
<hr>

<h3>Shipment History</h3>

${shipment.history.map(h => `<p>✔ ${h}</p>`).join("")}

</div>

`;
}
else{

document.getElementById("result").innerHTML =
"<p>Tracking number not found.</p>";

}

}

</script>

</body>
</html>
