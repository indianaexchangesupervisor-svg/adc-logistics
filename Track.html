<!DOCTYPE html>
<html>
<head>
<title>ADC Logistics Tracking</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f8;
    text-align:center;
    padding:40px;
}

.box{
    background:white;
    padding:30px;
    max-width:450px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

input{
    width:90%;
    padding:12px;
    margin:10px;
}

button{
    padding:12px 25px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:5px;
}

.result{
    margin-top:20px;
    text-align:left;
}
</style>

</head>

<body>

<div class="box">

<h1>ADC Logistics</h1>
<h3>Track Your Shipment</h3>

<input id="trackingNumber" placeholder="Enter Tracking Number">

<br>

<button onclick="trackShipment()">
Track Shipment
</button>

<div class="result" id="result"></div>

</div>


<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getFirestore, collection, query, where, getDocs }
from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// YOUR FIREBASE SETTINGS GO HERE
const firebaseConfig = {

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_AUTH_DOMAIN",

projectId:"YOUR_PROJECT_ID",

storageBucket:"YOUR_STORAGE_BUCKET",

messagingSenderId:"YOUR_SENDER_ID",

appId:"YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.trackShipment = async function(){

let number =
document.getElementById("trackingNumber").value;


let q=query(
collection(db,"shipments"),
where("trackingNumber","==",number)
);


let snapshot=await getDocs(q);



if(snapshot.empty){

document.getElementById("result").innerHTML =
"<h3>Shipment not found</h3>";

return;

}


snapshot.forEach(doc=>{


let data=doc.data();


document.getElementById("result").innerHTML=

`
<h3>Shipment Found</h3>

<p><b>Tracking:</b> ${data.trackingNumber}</p>

<p><b>Status:</b> ${data.status}</p>

<p><b>From:</b> ${data.origin}</p>

<p><b>To:</b> ${data.destination}</p>

<p><b>History:</b></p>

${data.history.map(item=>`

<p>
${item.date} - ${item.message}
</p>

`).join("")}

`;

});


}


</script>


</body>
</html>
