<script>
async function trackShipment() {
  const trackingInput = document.getElementById('trackingInput').value.trim();
  const resultDiv = document.getElementById('result');
  
  try {
    const res = await fetch('shipments.json?v=' + Date.now()); // prevents cache
    const shipments = await res.json();
    
    // Find the shipment - matches "tracking" field
    const data = shipments.find(s => s.tracking.toLowerCase() === trackingInput.toLowerCase());
    
    if(data){
      resultDiv.innerHTML = `
        <h3>Shipment Found</h3>
        <p><b>Tracking:</b> ${data.tracking}</p>
        <p><b>Customer:</b> ${data.customer}</p>
        <p><b>Sender:</b> ${data.sender}</p>
        <p><b>Status:</b> ${data.status}</p>
        <p><b>From:</b> ${data.origin}</p>
        <p><b>To:</b> ${data.destination}</p>
        <p><b>Current Location:</b> ${data.location}</p>
        <p><b>Expected Arrival:</b> ${data.arrival} ${data.arrivalTime}</p>
        <p><b>Insured Value:</b> ${data.insuredValue}</p>
        <p><b>Items:</b></p>
        <ul>
          ${data.items.map(item => `<li>${item}</li>`).join("")}
        </ul>
        <p><b>History:</b></p>
        ${data.history.map(item => `<p>• ${item}</p>`).join("")}
      `;
    } else {
      resultDiv.innerHTML = `<p style="color:red">Tracking number not found.</p>`;
    }
  } catch(e) {
    resultDiv.innerHTML = `<p style="color:red">Error: ${e.message}. Check if shipments.json is valid JSON.</p>`;
  }
}
</script>
